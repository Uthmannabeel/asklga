# Local or single-server deployment: the portal plus a Postgres it owns.
# For a pilot, run this on a Nigerian-hosted VM (Galaxy Backbone or a Nigerian cloud region)
# and put TLS in front (Caddy/nginx). Copy .env.example to .env and fill it in first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asklga
      POSTGRES_USER: asklga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asklga -d asklga"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://asklga:${POSTGRES_PASSWORD:-change-this-password}@db:5432/asklga
      # One reverse proxy (Caddy/nginx) in front sets X-Forwarded-For; rate limits trust that hop only.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      # Loopback only: the proxy on this host is the way in. Publishing 0.0.0.0:3000 would let
      # clients forge X-Forwarded-For and dodge the rate limits.
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
